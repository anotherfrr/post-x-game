<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STAR CATCHER — one prompt, one game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070312; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    color: rgba(255,255,255,.45); font-size: 13px; letter-spacing: .18em;
    text-transform: uppercase; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hint">← → move &nbsp;·&nbsp; catch stars &nbsp;·&nbsp; dodge rocks</div>
</div>
<script>
"use strict";
// STAR CATCHER — built by an AI agent from one prompt:
// "Build me a tiny browser game: a neon star-catcher. Fly a ship,
//  catch falling stars, dodge asteroids. One HTML file. Make it juicy."
const qs = new URLSearchParams(location.search);
const DEMO = qs.get("demo") === "1";

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
// Logical playfield is 540x960 (9:16); backing store is 2x for crispness.
const W = 540, H = 960, SS = 2;
cv.width = W * SS; cv.height = H * SS;

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const now = () => performance.now() / 1000;

const state = {
  mode: "title",           // title | playing | over
  score: 0, best: 0, streak: 0, lives: 3,
  time: 0, shake: 0, invuln: 0, flash: 0,
  shipX: W / 2, shipTX: W / 2, shipV: 0,
  stars: [], rocks: [], parts: [], bg: [],
  spawnStar: 0, spawnRock: 0, overAt: 0, startedAt: 0,
};
try { state.best = parseInt(localStorage.getItem("star-catcher-best") || "0", 10) || 0; } catch (e) {}

for (let i = 0; i < 90; i++) {
  state.bg.push({ x: rand(0, W), y: rand(0, H), r: rand(0.6, 2.2), s: rand(6, 26), tw: rand(0, TAU) });
}

function comboMult() { return Math.min(1 + Math.floor(state.streak / 5), 5); }

function spawnStar() {
  state.stars.push({ x: rand(30, W - 30), y: -24, vy: rand(2.1, 3.1) + state.time * 0.02,
    r: rand(13, 18), rot: rand(0, TAU), vr: rand(-0.03, 0.03), big: Math.random() < 0.12 });
}
function spawnRock() {
  state.rocks.push({ x: rand(34, W - 34), y: -30, vy: rand(2.4, 3.4) + state.time * 0.025,
    r: rand(16, 26), rot: rand(0, TAU), vr: rand(-0.05, 0.05), pts: 7 });
}
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(speed * 0.3, speed);
    state.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
      life: rand(0.35, 0.8), max: 0.8, color, r: rand(2, 5) });
  }
}

function startGame() {
  state.mode = "playing"; state.score = 0; state.streak = 0; state.lives = 3;
  state.time = 0; state.stars = []; state.rocks = []; state.parts = [];
  state.spawnStar = 0; state.spawnRock = 0; state.invuln = 0; state.flash = 0;
  state.shipX = W / 2; state.shipTX = W / 2; state.startedAt = now();
  document.getElementById("hint").style.display = "none";
}
function gameOver() {
  state.mode = "over"; state.overAt = now();
  if (state.score > state.best) {
    state.best = state.score;
    try { localStorage.setItem("star-catcher-best", String(state.best)); } catch (e) {}
  }
}

function drawStar(x, y, r, rot, color, glow) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45, a = (i * Math.PI) / 5 - Math.PI / 2;
    i === 0 ? ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawRock(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = "#ff2e63"; ctx.shadowBlur = 14;
  ctx.fillStyle = "#3a2b3f"; ctx.strokeStyle = "#ff2e63"; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * TAU, rr = r * (0.78 + 0.28 * Math.sin(i * 2.7 + 1.3));
    i === 0 ? ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = "rgba(255,46,99,.55)";
  ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.2, r * 0.16, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.3, r * 0.25, r * 0.11, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawShip(x, y, tilt) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
  ctx.shadowColor = "#08d9d6"; ctx.shadowBlur = 22;
  const g = ctx.createLinearGradient(0, -26, 0, 20);
  g.addColorStop(0, "#a5fff9"); g.addColorStop(0.5, "#08d9d6"); g.addColorStop(1, "#0a6cff");
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(0, -26); ctx.lineTo(20, 14); ctx.lineTo(8, 10); ctx.lineTo(0, 18); ctx.lineTo(-8, 10); ctx.lineTo(-20, 14);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(0, -6, 5, 0, TAU); ctx.fill();
  // engine flame
  const f = 10 + Math.random() * 10;
  ctx.fillStyle = "rgba(255,170,0,.9)"; ctx.beginPath();
  ctx.moveTo(-6, 16); ctx.lineTo(0, 16 + f); ctx.lineTo(6, 16); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function autopilot(dt) {
  // Chase the star CLOSEST to the catch line (largest y still above the
  // ship): the one about to arrive. Dodge any rock closing in on our lane.
  let target = null, bestY = -1e9;
  for (const s of state.stars) {
    if (s.y > -10 && s.y < 860 && s.y > bestY) { bestY = s.y; target = s; }
  }
  let tx = target ? target.x : W / 2;
  for (const r of state.rocks) {
    const dy = (H - 110) - r.y;
    if (dy > 0 && dy < 260 && Math.abs(r.x - state.shipX) < 74) {
      tx = r.x < state.shipX ? Math.min(W - 30, state.shipX + 120) : Math.max(30, state.shipX - 120);
      break;
    }
  }
  state.shipTX = clamp(tx, 28, W - 28);
  // Nudge toward the star's drift so catches stay centred.
  if (target) state.shipTX = clamp(state.shipTX, 28, W - 28);
}

function update(dt) {
  state.time += dt;
  if (state.invuln > 0) state.invuln -= dt;
  if (state.flash > 0) state.flash -= dt;
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 3);

  if (DEMO && state.mode === "title" && now() - (state.startedAt || now()) > 0.8) startGame();
  if (DEMO && state.mode === "over" && now() - state.overAt > 1.6) startGame();
  if (state.mode !== "playing") return;
  if (DEMO) autopilot(dt);

  // Ship follows target with a little lag + tilt.
  const prev = state.shipX;
  state.shipX += (state.shipTX - state.shipX) * Math.min(1, dt * 14);
  state.shipX = clamp(state.shipX, 26, W - 26);
  state.shipV = (state.shipX - prev) / Math.max(dt, 1e-3);

  // Spawns ramp up with time.
  state.spawnStar -= dt;
  if (state.spawnStar <= 0) { spawnStar(); state.spawnStar = Math.max(0.34, 0.62 - state.time * 0.006); }
  state.spawnRock -= dt;
  if (state.spawnRock <= 0 && state.time > 6) { spawnRock(); state.spawnRock = Math.max(0.9, 1.7 - state.time * 0.008); }

  const shipY = H - 110;
  for (let i = state.stars.length - 1; i >= 0; i--) {
    const s = state.stars[i]; s.y += s.vy * dt * 60; s.rot += s.vr * dt * 60;
    const dx = s.x - state.shipX, dy = s.y - shipY;
    if (Math.abs(dx) < 34 && Math.abs(dy) < 36) {
      state.streak++;
      const pts = 10 * comboMult() * (s.big ? 3 : 1);
      state.score += pts;
      burst(s.x, s.y, s.big ? "#ffea00" : "#ffd319", s.big ? 26 : 14, 3.2);
      state.stars.splice(i, 1);
    } else if (s.y > H + 30) { state.streak = 0; state.stars.splice(i, 1); }
  }
  for (let i = state.rocks.length - 1; i >= 0; i--) {
    const r = state.rocks[i]; r.y += r.vy * dt * 60; r.rot += r.vr * dt * 60;
    const dx = r.x - state.shipX, dy = r.y - shipY;
    if (Math.abs(dx) < 34 && Math.abs(dy) < 38) {
      state.rocks.splice(i, 1);
      if (state.invuln <= 0) {
        state.lives--; state.streak = 0; state.invuln = 1.4; state.shake = 1; state.flash = 0.35;
        burst(state.shipX, shipY, "#ff2e63", 30, 4.5);
        if (state.lives <= 0) gameOver();
      }
    } else if (r.y > H + 40) state.rocks.splice(i, 1);
  }
  for (let i = state.parts.length - 1; i >= 0; i--) {
    const p = state.parts[i]; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.06 * dt * 60; p.life -= dt;
    if (p.life <= 0) state.parts.splice(i, 1);
  }
}

function draw() {
  ctx.setTransform(SS, 0, 0, SS, 0, 0);
  const shx = state.shake > 0 ? rand(-6, 6) * state.shake : 0;
  const shy = state.shake > 0 ? rand(-6, 6) * state.shake : 0;
  ctx.save(); ctx.translate(shx, shy);

  // Background: deep-space gradient + drifting starfield.
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0b0620"); bg.addColorStop(0.55, "#150838"); bg.addColorStop(1, "#070312");
  ctx.fillStyle = bg; ctx.fillRect(-10, -10, W + 20, H + 20);
  const t = now();
  for (const b of state.bg) {
    const a = 0.25 + 0.55 * Math.abs(Math.sin(t * 0.7 + b.tw));
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(b.x, (b.y + t * b.s) % H, b.r, 0, TAU); ctx.fill();
  }
  // Nebula blobs: soft radial glows, not hard discs.
  let neb = ctx.createRadialGradient(120, 220, 0, 120, 220, 180);
  neb.addColorStop(0, "rgba(196,28,131,.30)"); neb.addColorStop(1, "rgba(196,28,131,0)");
  ctx.fillStyle = neb; ctx.fillRect(-10, -10, W + 20, H + 20);
  neb = ctx.createRadialGradient(430, 640, 0, 430, 640, 200);
  neb.addColorStop(0, "rgba(10,108,255,.26)"); neb.addColorStop(1, "rgba(10,108,255,0)");
  ctx.fillStyle = neb; ctx.fillRect(-10, -10, W + 20, H + 20);

  if (state.mode === "title") {
    ctx.textAlign = "center";
    drawStar(W / 2, 250, 46, t * 0.4, "#ffd319", 40);
    ctx.fillStyle = "#fff"; ctx.font = "900 64px 'Segoe UI', system-ui, sans-serif";
    ctx.shadowColor = "#ff2e63"; ctx.shadowBlur = 30;
    ctx.fillText("STAR", W / 2, 380);
    ctx.fillText("CATCHER", W / 2, 450);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#08d9d6"; ctx.font = "700 22px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("ONE PROMPT. ONE GAME.", W / 2, 510);
    ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.font = "400 20px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("Catch the stars. Dodge the rocks.", W / 2, 560);
    if (Math.floor(t * 2) % 2 === 0) {
      ctx.fillStyle = "#ffd319"; ctx.font = "700 24px 'Segoe UI', system-ui, sans-serif";
      ctx.fillText(DEMO ? "AUTO-PLAYING…" : "TAP OR PRESS ANY KEY", W / 2, 680);
    }
    drawShip(W / 2, H - 110, Math.sin(t) * 0.08);
    ctx.restore(); return;
  }

  for (const s of state.stars) drawStar(s.x, s.y, s.r, s.rot, s.big ? "#ffea00" : "#ffd319", s.big ? 30 : 18);
  for (const r of state.rocks) drawRock(r.x, r.y, r.r, r.rot);
  for (const p of state.parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (!(state.invuln > 0 && Math.floor(t * 12) % 2 === 0)) {
    drawShip(state.shipX, H - 110, clamp(state.shipV * 0.0009, -0.3, 0.3));
  }

  // HUD
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.font = "700 17px 'Segoe UI', system-ui, sans-serif";
  ctx.fillText("SCORE", 24, 46);
  ctx.fillStyle = "#fff"; ctx.font = "900 44px 'Segoe UI', system-ui, sans-serif";
  ctx.shadowColor = "#08d9d6"; ctx.shadowBlur = 16;
  ctx.fillText(String(state.score), 24, 92);
  ctx.shadowBlur = 0;
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.font = "700 17px 'Segoe UI', system-ui, sans-serif";
  ctx.fillText("BEST  " + state.best, W - 24, 46);
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < state.lives ? "#ff2e63" : "rgba(255,255,255,.18)";
    ctx.font = "28px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("♥", W - 24 - i * 34, 92);
  }
  if (comboMult() > 1 && state.mode === "playing") {
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffea00"; ctx.font = "900 30px 'Segoe UI', system-ui, sans-serif";
    ctx.shadowColor = "#ffea00"; ctx.shadowBlur = 18;
    ctx.fillText("COMBO ×" + comboMult(), W / 2, 150);
    ctx.shadowBlur = 0;
  }

  if (state.mode === "over") {
    ctx.fillStyle = "rgba(7,3,18,.72)"; ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff2e63"; ctx.font = "900 58px 'Segoe UI', system-ui, sans-serif";
    ctx.shadowColor = "#ff2e63"; ctx.shadowBlur = 26;
    ctx.fillText("GAME OVER", W / 2, 400);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff"; ctx.font = "700 24px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("SCORE  " + state.score, W / 2, 470);
    ctx.fillStyle = "#ffd319"; ctx.font = "700 24px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("BEST  " + state.best, W / 2, 510);
    if (Math.floor(t * 2) % 2 === 0) {
      ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.font = "700 22px 'Segoe UI', system-ui, sans-serif";
      ctx.fillText(DEMO ? "RESTARTING…" : "PRESS R TO PLAY AGAIN", W / 2, 600);
    }
  }
  if (state.flash > 0) {
    ctx.fillStyle = `rgba(255,46,99,${state.flash * 0.5})`;
    ctx.fillRect(-10, -10, W + 20, H + 20);
  }
  ctx.restore();
}

let last = now();
function loop() {
  const t = now(), dt = Math.min(0.1, t - last); last = t;
  update(dt); draw();
  requestAnimationFrame(loop);
}
window.__game = state; // for verification / recording harnesses

addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a") state.shipTX = clamp(state.shipTX - 46, 26, W - 26);
  if (e.key === "ArrowRight" || e.key === "d") state.shipTX = clamp(state.shipTX + 46, 26, W - 26);
  if (state.mode === "title") startGame();
  else if (state.mode === "over" && (e.key === "r" || e.key === "R" || e.key === "Enter" || e.key === " ")) startGame();
});
function pointerMove(clientX) {
  const r = cv.getBoundingClientRect();
  state.shipTX = clamp(((clientX - r.left) / r.width) * W, 26, W - 26);
  if (state.mode === "title") startGame();
}
cv.addEventListener("pointermove", (e) => pointerMove(e.clientX));
cv.addEventListener("pointerdown", (e) => {
  pointerMove(e.clientX);
  if (state.mode === "over") startGame();
});
if (DEMO) state.startedAt = now();
requestAnimationFrame(loop);
</script>
</body>
</html>
